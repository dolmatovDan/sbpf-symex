name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Холодный JitPack может долго собирать usvm или зависнуть.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # build включает тесты; usvm приходит готовой с JitPack, Rust и ../sbpf-ir не нужны.
      - run: ./gradlew build
