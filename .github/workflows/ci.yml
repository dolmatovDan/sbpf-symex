name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # A cold JitPack may take long to build usvm or hang; a cold release build of sbpf-lift
    # (agave, Mollusk) adds several more minutes.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: sbpf-symex
      # Tests compare the machine with the sbpf-ir lifter and runner: its main is taken as is, unpinned.
      - uses: actions/checkout@v4
        with:
          repository: dolmatovDan/sbpf-ir
          path: sbpf-ir
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # Installs the toolchain from sbpf-ir's rust-toolchain.toml before rust-cache computes its key
      # (rustup show no longer installs it since 1.28).
      - run: rustup toolchain install
        working-directory: sbpf-ir
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sbpf-ir
      # build includes tests; sbpf-lift is built by the buildSbpfLift task from the sibling sbpf-ir directory.
      - run: ./gradlew build
        working-directory: sbpf-symex
