# https://docs.gradle.org/current/userguide/version_catalogs.html#sec::toml-dependencies-format

[versions]
kotlin = "2.4.10"
# usvm commit on JitPack. Before bumping: see README, "Окружение".
usvm = "6b2a0781a728d14ca9271b33830c8db734157e54"
# KSMT and collections-immutable are exactly the versions usvm is built with
# (usvm/buildSrc/src/main/kotlin/Dependencies.kt); otherwise Gradle silently bumps them for usvm too.
ksmt = "0.5.26"
kotlinx-collections-immutable = "0.3.8"
kotlinx-serialization = "1.12.0"
junit-jupiter-engine = "6.0.1"

[libraries]
# usvm pulls in kotlin-bom 2.1.0, which pins kotlin-reflect to 2.1.0 next to stdlib 2.4.10.
kotlin-bom = { module = "org.jetbrains.kotlin:kotlin-bom", version.ref = "kotlin" }
usvm-core = { module = "com.github.UnitTestBot.usvm:usvm-core", version.ref = "usvm" }
ksmt-core = { module = "io.ksmt:ksmt-core", version.ref = "ksmt" }
ksmt-yices = { module = "io.ksmt:ksmt-yices", version.ref = "ksmt" }
kotlinx-collections-immutable = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable-jvm", version.ref = "kotlinx-collections-immutable" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit-jupiter-engine" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
