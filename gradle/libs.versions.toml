# https://docs.gradle.org/current/userguide/version_catalogs.html#sec::toml-dependencies-format

[versions]
kotlin = "2.4.10"
# Коммит usvm на JitPack. Почему не новее — README, «Окружение».
usvm = "dab6d43261eba1c4e72b35d8eda91763b6494934"
# KSMT и collections-immutable — ровно те версии, с которыми собрана usvm
# (usvm/buildSrc/src/main/kotlin/Dependencies.kt), иначе Gradle молча поднимет их и для usvm.
ksmt = "0.5.26"
kotlinx-collections-immutable = "0.3.8"
kotlinx-serialization = "1.12.0"
junit-jupiter-engine = "6.0.1"

[libraries]
usvm-core = { module = "com.github.UnitTestBot.usvm:usvm-core", version.ref = "usvm" }
ksmt-core = { module = "io.ksmt:ksmt-core", version.ref = "ksmt" }
ksmt-yices = { module = "io.ksmt:ksmt-yices", version.ref = "ksmt" }
kotlinx-collections-immutable = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable-jvm", version.ref = "kotlinx-collections-immutable" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit-jupiter-engine" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
